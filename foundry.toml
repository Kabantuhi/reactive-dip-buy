[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.29"
optimizer = true
optimizer_runs = 200
remappings = [
    "@reactive/=lib/reactive-lib-omni/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
lasna = "https://lasna-rpc.rnk.dev/"
unichain_sepolia = "https://sepolia.unichain.org/"
sepolia = "https://ethereum-sepolia-rpc.publicnode.com/"
